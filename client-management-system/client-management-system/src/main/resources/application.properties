spring.application.name=client-management-system
server.port=8080

# ------------------------------------------------------------------
# MongoDB
# MongoDB is a SEPARATE program. It must already be running on your
# computer before you click Run in IntelliJ IDEA.
# To use a different server, set the MONGODB_URI environment variable
# in IntelliJ: Run > Edit Configurations... > Environment variables
# ------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/client_management}

# Indexes (including the unique email index) are created by
# config/MongoStartupCheck right after startup, so a stopped database
# produces a clear message in the Run console instead of a crash.
spring.data.mongodb.auto-index-creation=false

# Never send stack traces to the browser
server.error.include-stacktrace=never
server.error.include-message=never

# Keep the Run console readable
logging.level.org.mongodb.driver=WARN
